# Managed by NASe — installed to /etc/systemd/journald.conf.d/50-nase.conf
# by apply.sh. Do not edit in place; edit config/journald-nase.conf instead.
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# with Storage=volatile, which keeps the journal in /run and destroys it on
# every reboot. That is kind to the SD card, but it means a shutdown that
# hangs leaves no evidence whatsoever — which is exactly what happened on
# 2026-09-05 (backlog #31) and why that failure could only be reconstructed
# from side effects. This drop-in sorts after the vendor one, so it wins.
#
# The size caps keep the cost bounded: 200 MB total, rotated in 25 MB files,
# compressed. That is a few weeks of this box's logs, and it is the only
# record that survives a reboot.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemMaxFileSize=25M
