# Managed by NASe — installed to /etc/systemd/system.conf.d/50-nase.conf
# by apply.sh. Do not edit in place; edit config/system-nase.conf instead.
#
# The stock 90 s stop timeout means a handful of stuck units can add minutes
# to a shutdown that looks, from outside, like a machine that has hung —
# which is how the 2026-09-05 reboot ended with the power being pulled
# (backlog #31). 30 s is still far longer than anything here legitimately
# needs to stop: the longest-running job is an rsync, and killing one
# mid-flight costs nothing, since sync jobs are idempotent and deletions go
# to .trash rather than being applied destructively.
#
# This bounds unit stop jobs only. A kernel-side unmount that never returns
# is not covered by any timeout — that is what modules/drives/teardown.sh
# and its lazy-unmount fallback are for.
[Manager]
DefaultTimeoutStopSec=30s
