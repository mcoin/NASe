# NASe configuration — single source of truth.
# After editing, run: sudo ./apply.sh

nas:
  hostname: nase

# --------------------------------------------------------------------------
# Drives
# --------------------------------------------------------------------------
# active:         false to skip this drive entirely (no mount, no spindown,
#                 no SMART check).  Useful for pre-configuring a drive before
#                 it is physically attached.  Defaults to true when omitted.
# read_only:      mount the drive read-only. Enforced at the kernel level —
#                 no user or application can write to it.  Sync jobs
#                 automatically remount rw for the duration of the sync.
# role:           "main" or "backup"
# owner:          user that should own the mountpoint directory.  apply.sh sets
#                 ownership of the mountpoint itself (instant).  To recursively
#                 fix ownership of all existing files run: sudo ./fix-ownership.sh
# spindown_min:   minutes of inactivity before the drive spins down (0 = never)
# smart_check:    enable periodic SMART health monitoring
# --------------------------------------------------------------------------
drives:
  - name: primary
    active: true
    uuid: "524be343-0c1c-4f8e-91c0-b0f1fab13534"
    label: "intenso1"
    mountpoint: /mnt/primary
    role: main
    filesystem: ext4
    spindown_min: 60
    smart_check: true
    owner: nase

  - name: backup_daily
    active: true
    uuid: "532b7925-0236-4dd4-8454-56050eb510d2"
    label: "proworx"
    mountpoint: /mnt/backup_daily
    role: backup
    filesystem: ext4
    spindown_min: 60
    smart_check: true
    read_only: true

# --------------------------------------------------------------------------
# Samba
# --------------------------------------------------------------------------
samba:
  workgroup: WORKGROUP
  users:
    - nase
  shares:
    - name: audiobooks
      path: /mnt/primary/audiobooks
      read_only: false
      valid_users: "nase"
    - name: backups
      path: /mnt/primary/backups
      read_only: false
      valid_users: "nase"
    - name: bd
      path: /mnt/primary/bd
      read_only: false
      valid_users: "nase"
    - name: movies
      path: /mnt/primary/movies
      read_only: false
      valid_users: "nase"
    - name: music
      path: /mnt/primary/music
      read_only: false
      valid_users: "nase"
    - name: photo
      path: /mnt/primary/photo
      read_only: false
      valid_users: "nase"
    - name: podcasts
      path: /mnt/primary/podcasts
      read_only: false
      valid_users: "nase"
    - name: video
      path: /mnt/primary/video
      read_only: false
      valid_users: "nase"
    - name: Backup_daily
      path: /mnt/backup_daily
      read_only: true
      valid_users: "nase"
    - name: Trash_daily
      path: /mnt/backup_daily/.trash
      read_only: true
      valid_users: "nase"
tailscale:
  enabled: true
  # Auth key is read from .env: TAILSCALE_AUTHKEY
  # Set to true to route all client traffic through this node
  advertise_exit_node: false
  # Advertise LAN subnet to other Tailscale nodes (e.g. "192.168.1.0/24")
  # Leave empty to disable subnet routing
  advertise_routes: ""

# --------------------------------------------------------------------------
# Config archive
# --------------------------------------------------------------------------
# Probes /opt/nase/config.yaml for changes on a schedule and copies it to
# dest. On each change writes dest/config.yaml (latest) and a timestamped
# snapshot dest/<ISO-timestamp>/config.yaml for reference.
# Old snapshots are pruned after retention_days.
# schedule: systemd OnCalendar format (see sync_jobs comment below)
# on_failure: "notify" | "ignore"
# --------------------------------------------------------------------------
config_archive:
  dest: /mnt/primary/backups/NASe
  schedule: '*-*-* 02:00:00'
  retention_days: 90
  on_failure: notify
sync_jobs:
  # NASe config archive — mirrors the versioned config history to the backup
  # drive. Trash is disabled; snapshots are managed by the config-archive timer.
  - name: nase-cfg-backup-daily
    source: /mnt/primary/backups/NASe/
    dest: /mnt/backup_daily/NASe/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: false
  - name: audiobooks-backup-daily
    source: /mnt/primary/audiobooks/
    dest: /mnt/backup_daily/audiobooks/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: bd-backup-daily
    source: /mnt/primary/bd/
    dest: /mnt/backup_daily/bd/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: backups-backup-daily
    source: /mnt/primary/backups/
    dest: /mnt/backup_daily/backups/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: movies-backup-daily
    source: /mnt/primary/movies/
    dest: /mnt/backup_daily/movies/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: music-backup-daily
    source: /mnt/primary/music/
    dest: /mnt/backup_daily/music/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: photo-backup-daily
    source: /mnt/primary/photo/
    dest: /mnt/backup_daily/photo/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: podcasts-backup-daily
    source: /mnt/primary/podcasts/
    dest: /mnt/backup_daily/podcasts/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: video-backup-daily
    source: /mnt/primary/video/
    dest: /mnt/backup_daily/video/
    schedule: '*-*-* 03:00:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30

# --------------------------------------------------------------------------
# Checksum integrity manifest (see INTEGRITY_DESIGN.md)
# --------------------------------------------------------------------------
# Maintains a per-file checksum database on each drive (<mountpoint>/.nase/)
# to catch silent bit-rot that SMART monitoring and rsync's size/mtime-based
# sync would both miss. Coverage builds progressively in the background —
# no manual bootstrap required — piggybacking on the existing nightly sync
# window so it never triggers extra drive spin-ups on its own.
#
# enabled:              master switch; false disables every integrity
#                        module/script as a no-op (safe default).
# cycle_days:            verify every known file at least once per this many
#                        days.
# min_sample/max_sample: files processed per drive per night, floor/ceiling.
# skip_recent_seconds:   don't sample files touched more recently than this
#                        (avoids racing an in-progress write on primary).
#
# Enable with 'sudo nase apply integrity' (or a full apply.sh run), then
# 'sudo nase integrity status' to watch discovery progress. Uses
# 'sudo nase integrity bootstrap <drive>' for an optional full-speed pass —
# see INTEGRITY_DESIGN.md before running it on a multi-terabyte drive.
# --------------------------------------------------------------------------
integrity:
  enabled: false
  cycle_days: 60
  min_sample: 200
  max_sample: 5000
  skip_recent_seconds: 3600

services:
  web:
    enabled: true
    # Port for the NASe web dashboard (status + logs)
    port: 8088

  filebrowser:
    enabled: true
    # Port the web UI listens on (access via http://<hostname>:<port>)
    port: 8080
    # Virtual root exposed by the file browser.  apply.sh populates this
    # directory with bind mounts so the view mirrors the Samba/Finder layout:
    # primary-drive shares appear at the top level; the backup drive and trash
    # appear as "Backup" and "Trash" virtual folders (names get a "_NAS" suffix
    # if a primary-drive share already uses those names).
    # Do not set this to /mnt — that would expose the raw primary/backup level.
    root: /srv/filebrowser
    # Login username (password set via FILEBROWSER_PASSWORD in .env)
    username: nase
    # Base URL path if served behind a reverse proxy (e.g. "/files").
    # Leave empty for direct access.
    base_url: ""

notifications:
  method: email
  email: thomas.vettorel+NASe@gmail.com

# --------------------------------------------------------------------------
# Status report
# --------------------------------------------------------------------------
# Sends a periodic notification summarising system health and all file
# operations (synced / trashed) that occurred since the last report.
# schedule: systemd OnCalendar format (default: every Saturday at 3 AM)
# --------------------------------------------------------------------------
status_report:
  enabled: true
  schedule: 'Sat *-*-* 03:00:00'
