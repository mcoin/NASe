# NASe configuration — single source of truth.
# After editing, run: sudo ./apply.sh

nas:
  hostname: nase

# --------------------------------------------------------------------------
# Drives
# --------------------------------------------------------------------------
# active:         false to skip this drive entirely (no mount, no spindown,
#                 no SMART check).  Useful for pre-configuring a drive before
#                 it is physically attached.  Defaults to true when omitted.
# read_only:      mount the drive read-only. Enforced at the kernel level —
#                 no user or application can write to it.  Sync jobs
#                 automatically remount rw for the duration of the sync.
# role:           "main" or "backup"
# owner:          user that should own the mountpoint directory.  apply.sh sets
#                 ownership of the mountpoint itself (instant).  To recursively
#                 fix ownership of all existing files run: sudo ./fix-ownership.sh
# spindown_min:   minutes of inactivity before the drive spins down (0 = never)
# smart_check:    enable periodic SMART health monitoring
# --------------------------------------------------------------------------
drives:
  - name: primary
    active: true
    uuid: "532b7925-0236-4dd4-8454-56050eb510d2"
    label: "NAS_PRIMARY"
    mountpoint: /mnt/primary
    role: main
    filesystem: ext4
    spindown_min: 60
    smart_check: true
    owner: nase

  - name: backup_daily
    active: true
    uuid: "044b7611-ec84-48e3-9ded-bf6a76876d01"
    label: "NAS_BACKUP_1"
    mountpoint: /mnt/backup_daily
    role: backup
    filesystem: ext4
    spindown_min: 60
    smart_check: true
    read_only: true

  - name: backup_weekly
    active: true
    uuid: "135c94c8-d188-442a-a8b4-97061c11ac62"
    label: "NAS_BACKUP_2"
    mountpoint: /mnt/backup_weekly
    role: backup
    filesystem: ext4
    spindown_min: 60
    smart_check: true
    read_only: true

# --------------------------------------------------------------------------
# Samba
# --------------------------------------------------------------------------
samba:
  workgroup: WORKGROUP
  users:
    - nase
  shares:
    - name: Music
      path: /mnt/primary/Music
      read_only: false
      valid_users: "nase"
    - name: omv2
      path: /mnt/primary/omv2
      read_only: false
      valid_users: "nase"
    - name: Photo_albums
      path: /mnt/primary/Photo_albums
      read_only: false
      valid_users: "nase"
    - name: test
      path: /mnt/primary/test
      read_only: false
      valid_users: "nase"
    - name: videos
      path: /mnt/primary/videos
      read_only: false
      valid_users: "nase"
    - name: NASe
      path: /mnt/primary/NASe
      read_only: true
      valid_users: "nase"
    - name: Backup_daily
      path: /mnt/backup_daily
      read_only: true
      valid_users: "nase"
    - name: Trash_daily
      path: /mnt/backup_daily/.trash
      read_only: true
      valid_users: "nase"
    - name: Backup_weekly
      path: /mnt/backup_weekly
      read_only: true
      valid_users: "nase"
    - name: Trash_weekly
      path: /mnt/backup_weekly/.trash
      read_only: true
      valid_users: "nase"
tailscale:
  enabled: true
  # Auth key is read from .env: TAILSCALE_AUTHKEY
  # Set to true to route all client traffic through this node
  advertise_exit_node: false
  # Advertise LAN subnet to other Tailscale nodes (e.g. "192.168.1.0/24")
  # Leave empty to disable subnet routing
  advertise_routes: ""

# --------------------------------------------------------------------------
# Config archive
# --------------------------------------------------------------------------
# Probes /opt/nase/config.yaml for changes on a schedule and copies it to
# dest. On each change writes dest/config.yaml (latest) and a timestamped
# snapshot dest/<ISO-timestamp>/config.yaml for reference.
# Old snapshots are pruned after retention_days.
# schedule: systemd OnCalendar format (see sync_jobs comment below)
# on_failure: "notify" | "ignore"
# --------------------------------------------------------------------------
config_archive:
  dest: /mnt/primary/NASe
  schedule: '*-*-* *:00/05:00'
  retention_days: 90
  on_failure: notify
sync_jobs:
  # NASe config archive — mirrors the versioned config history to both backup
  # drives. Trash is disabled; snapshots are managed by the config-archive timer.
  - name: nase-cfg-backup-daily
    source: /mnt/primary/NASe/
    dest: /mnt/backup_daily/NASe/
    schedule: '*-*-* *:00/05:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: false
  - name: nase-cfg-backup-weekly
    source: /mnt/primary/NASe/
    dest: /mnt/backup_weekly/NASe/
    schedule: '*-*-* *:00/10:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 1
    trash:
      enabled: false
  - name: music-backup-daily
    source: /mnt/primary/Music/
    dest: /mnt/backup_daily/Music/
    schedule: '*-*-* *:00/01:00'
    rsync_flags: --archive --delete --checksum
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: omv2-backup-daily
    source: /mnt/primary/omv2/
    dest: /mnt/backup_daily/omv2/
    schedule: '*-*-* *:00/01:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: photos-backup-daily
    source: /mnt/primary/Photo_albums/
    dest: /mnt/backup_daily/Photo_albums/
    schedule: '*-*-* *:00/01:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: test-backup-daily
    source: /mnt/primary/test/
    dest: /mnt/backup_daily/test/
    schedule: '*-*-* *:00/01:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: videos-backup-daily
    source: /mnt/primary/videos/
    dest: /mnt/backup_daily/videos/
    schedule: '*-*-* *:00/01:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_daily/.trash
      retention_days: 30
  - name: music-backup-weekly
    source: /mnt/primary/Music/
    dest: /mnt/backup_weekly/Music/
    schedule: '*-*-* *:00/10:00'
    rsync_flags: --archive --delete --checksum
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_weekly/.trash
      retention_days: 30
  - name: omv2-backup-weekly
    source: /mnt/primary/omv2/
    dest: /mnt/backup_weekly/omv2/
    schedule: '*-*-* *:00/10:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_weekly/.trash
      retention_days: 30
  - name: photos-backup-weekly
    source: /mnt/primary/Photo_albums/
    dest: /mnt/backup_weekly/Photo_albums/
    schedule: '*-*-* *:00/10:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_weekly/.trash
      retention_days: 30
  - name: test-backup-weekly
    source: /mnt/primary/test/
    dest: /mnt/backup_weekly/test/
    schedule: '*-*-* *:00/10:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_weekly/.trash
      retention_days: 30
  - name: videos-backup-weekly
    source: /mnt/primary/videos/
    dest: /mnt/backup_weekly/videos/
    schedule: '*-*-* *:00/10:00'
    rsync_flags: --archive --delete
    on_failure: notify
    force_sync_days: 7
    trash:
      enabled: true
      path: /mnt/backup_weekly/.trash
      retention_days: 30
services:
  web:
    enabled: true
    # Port for the NASe web dashboard (status + logs)
    port: 8088

  filebrowser:
    enabled: true
    # Port the web UI listens on (access via http://<hostname>:<port>)
    port: 8080
    # Virtual root exposed by the file browser.  apply.sh populates this
    # directory with bind mounts so the view mirrors the Samba/Finder layout:
    # primary-drive shares appear at the top level; the backup drive and trash
    # appear as "Backup" and "Trash" virtual folders (names get a "_NAS" suffix
    # if a primary-drive share already uses those names).
    # Do not set this to /mnt — that would expose the raw primary/backup level.
    root: /srv/filebrowser
    # Login username (password set via FILEBROWSER_PASSWORD in .env)
    username: nase
    # Base URL path if served behind a reverse proxy (e.g. "/files").
    # Leave empty for direct access.
    base_url: ""

# --------------------------------------------------------------------------
# File watch notifications
# --------------------------------------------------------------------------
# Watch files or folders on the share and send a notification on file events.
# events: list of "modify" | "delete" | "create"
# label:  human-readable name used in the notification subject line.
# A 60-second cooldown prevents notification floods for the same watch entry.
#
# file_watch:
#   - path: /mnt/primary/Documents/
#     label: "Documents"
#     events: [modify, delete]
#   - path: /mnt/primary/important.txt
#     label: "Important file"
#     events: [modify, delete, create]
file_watch:
  - path: /mnt/primary/NASe
    label: NASe config notification
    events:
      - delete
  - path: /mnt/primary/omv2/NASe
    label: NASe notification
    events:
      - modify
      - delete
  - path: /mnt/primary/omv2/test.txt
    label: test.txt notification
    events:
      - modify
      - delete
  - path: /mnt/primary/omv2/test2.txt
    label: test2.txt notification
    events:
      - modify
  - path: /mnt/primary/omv2/test3.txt
    label: test3.txt notification
    events:
      - create
      - delete
  - path: /mnt/primary/omv2/test4.txt
    label: test4.txt notification
    events:
      - create
  - path: /mnt/primary/omv2/test5.txt
    label: test5.txt notification
    events:
      - create
notifications:
  method: email
  email: thomas.vettorel+NASe@gmail.com
