{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

  <!-- ── Status (auto-refresh every 30 s) ──────────────────────────────── -->
  <div id="status-wrap"
       hx-get="/partials/status"
       hx-trigger="every 30s"
       hx-swap="innerHTML">
    {% include "partials/status.html" %}
  </div>

  <!-- ── Logs ──────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-head">
      <span>Logs</span>
      <form id="log-form">
        <select name="job" class="log-selector">
          <option value="">Central log</option>
          {% for name in job_names %}
          <option value="{{ name }}">{{ name }}</option>
          {% endfor %}
        </select>
      </form>
    </div>
    <div id="log-content"
         class="log-panel"
         hx-get="/partials/logs"
         hx-include="#log-form"
         hx-trigger="every 5s, change from:#log-form select"
         hx-swap="innerHTML">
      {% include "partials/logs.html" %}
    </div>
  </div>

{% endblock %}

{% block scripts %}
<script>
  // Auto-scroll to the newest log line on refresh, but only when the user
  // was already at (or near) the bottom before the refresh — otherwise a
  // reader scrolled up to review older lines gets yanked back down every
  // poll. Switching jobs always snaps to bottom since it's a fresh log.
  var logStickToBottom = true;

  document.getElementById("log-form").addEventListener("change", function () {
    logStickToBottom = true;
  });

  document.body.addEventListener("htmx:beforeSwap", function (e) {
    if (e.detail.target.id !== "log-content") return;
    if (!logStickToBottom) {
      var el = e.detail.target;
      logStickToBottom = (el.scrollTop + el.clientHeight >= el.scrollHeight - 20);
    }
  });

  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.detail.target.id !== "log-content") return;
    if (logStickToBottom) {
      e.detail.target.scrollTop = e.detail.target.scrollHeight;
    }
    logStickToBottom = false;
  });

  window.addEventListener("load", function () {
    var p = document.getElementById("log-content");
    if (p) p.scrollTop = p.scrollHeight;
  });
</script>
{% endblock %}
